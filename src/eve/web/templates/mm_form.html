{% extends "base.html" %}
{% block title %}Market Making{% endblock %}
{% block content %}
<h1>Market Making</h1>
<form method="post" action="/mm">
  <label>Station
    <select name="station_id" required>
      {% for id, name in stations %}
      <option value="{{ id }}" {{ "selected" if id == station_id }}>{{ name }} ({{ id }})</option>
      {% else %}
      <option value="" disabled>No stations known yet -- run `eve load-sde`</option>
      {% endfor %}
    </select>
  </label>
  <label>Capital (ISK)
    <input type="number" step="any" name="capital" value="{{ capital or '' }}" required>
  </label>
  <button type="submit">Suggest orders</button>
</form>
{% endblock %}
