{% extends "base.html" %}
{% block title %}Market Making{% endblock %}
{% block content %}
<h1>Market Making</h1>
<form method="post" action="/mm">
  <label>Station ID
    <input type="number" name="station_id" value="{{ station_id or '' }}" required>
  </label>
  <label>Capital (ISK)
    <input type="number" step="any" name="capital" value="{{ capital or '' }}" required>
  </label>
  <button type="submit">Suggest orders</button>
</form>
{% endblock %}
