[project]
name = "eve"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DjokaIzPotoka", email = "paunbiznis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "polars>=1.44.2",
    "pulp>=3.3.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "tomlkit>=0.15.1",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
eve = "eve.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
